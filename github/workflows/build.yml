name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  host-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make host_test && ./host_test

  nspire:
    runs-on: ubuntu-22.04
    needs: host-test
    steps:
      - uses: actions/checkout@v4

      - name: Install SDK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git wget unzip texinfo php-cli \
            libgmp-dev libmpfr-dev libmpc-dev libboost-all-dev libpng-dev zlib1g-dev

      # The toolchain build takes a long time, so it is cached after the first run.
      - name: Restore Ndless SDK cache
        id: cache
        uses: actions/cache@v4
        with:
          path: Ndless
          key: ndless-sdk-${{ runner.os }}-v1

      - name: Build Ndless SDK
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone --recursive https://github.com/ndless-nspire/Ndless.git
          cd Ndless/ndless-sdk/toolchain
          ./build_toolchain.sh
          cd ../..
          make

      - name: Build c64
        run: |
          export PATH="$GITHUB_WORKSPACE/Ndless/ndless-sdk/toolchain/install/bin:$GITHUB_WORKSPACE/Ndless/ndless-sdk/bin:$PATH"
          make

      - uses: actions/upload-artifact@v4
        with:
          name: c64-nspire
          path: c64.prg.tns
